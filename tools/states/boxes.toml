# The page's boxes by name (tools/run dom --fixture): the CSS selector each name reads at a
# shot. Each milestone appends the boxes its layouts lay out. Missing selectors are left out
# of page.json and reported.
#
# H0: no canvas exists at af434dc (the template page), so the fixture records the
# root's box as the stand-in; h2 adds the canvas once the reference has it.
canvas = "canvas"
root = "#root"
# H1 at adb0534: still no <canvas> or <header> element (the plane comes at h2), so canvas
# stays missing and header reads the top bar div structurally: #root's page div's first
# div child. title is the h1; gear is the first button (the only one while the menu is
# closed, and still the first while it is open).
header = "#root > div > div"
title = "h1"
gear = "button"
# H2 at c409aad: the return-to-centre button over the canvas (CSS-module hashes
# make class selectors unusable, so the accessible name selects it).
overlay_button = "button[aria-label=\"Return to center\"]"
