# The page's boxes by name (tools/run dom --fixture): the CSS selector each name reads at a
# shot. Each milestone appends the boxes its layouts lay out. Missing selectors are left out
# of page.json and reported.
#
# H0: no canvas exists at af434dc (the template page), so the fixture records the
# root's box as the stand-in; h2 adds the canvas once the reference has it.
canvas = "canvas"
root = "#root"

# h1-settings: the settings menu's boxes. The menu is a popover div with a
# generated id; radio inputs are 0x0, so the labels select through :has.
# option_0..2 are the dark list, option_3..5 the light list (only one list is
# ever in the DOM); swatch_0 is the first row's swatch.
menu = 'div[id^="settings-menu-"]'
radio_system = 'label:has(> input[value="system"])'
radio_dark = 'label:has(> input[value="dark"])'
radio_light = 'label:has(> input[value="light"])'
option_0 = 'label:has(> input[value="arctic-ice"])'
option_1 = 'label:has(> input[value="tron-cyan"])'
option_2 = 'label:has(> input[value="midnight-violet"])'
option_3 = 'label:has(> input[value="clean-teal"])'
option_4 = 'label:has(> input[value="educational-warm"])'
option_5 = 'label:has(> input[value="sage-editorial"])'
swatch_0 = 'label:has(> input[value="arctic-ice"]) svg'
# H1 at adb0534: still no <canvas> or <header> element (the plane comes at h2), so canvas
# stays missing and header reads the top bar div structurally: #root's page div's first
# div child. title is the h1; gear is the first button (the only one while the menu is
# closed, and still the first while it is open).
header = "#root > div > div"
title = "h1"
gear = "button"
# H2 at c409aad: the return-to-centre button over the canvas (CSS-module hashes
# make class selectors unusable, so the accessible name selects it). Renamed
# at 5cef052 (the tooltip commit) to "Reset view to origin"; the tooltip is
# the button's span (h6-handles' selector). The judged tip region is the
# union across engines: WebKit [1205.296875, 783, 147.203125, 31] against
# Chromium [1205.875, 783, 146.625, 31] (their shapers disagree by 0.58 px),
# i.e. [1205.296875, 783, 147.703125, 31].
overlay_button = "button[aria-label=\"Reset view to origin\"]"
overlay_tip = "button[aria-label=\"Reset view to origin\"] span"
# H3 at 3560eb2: the sidebar column, the Function card (the sidebar's first
# div child), and the four option labels (the buttons div's children).
# CSS-module hashes make class selectors unusable; structural selectors
# verified against the reference (probe.json boxes).
sidebar = "#root > div > div:nth-child(2)"
card_function = "#root > div > div:nth-child(2) > div"
radio_0 = "#root > div > div:nth-child(2) fieldset div > label:nth-child(1)"
radio_1 = "#root > div > div:nth-child(2) fieldset div > label:nth-child(2)"
radio_2 = "#root > div > div:nth-child(2) fieldset div > label:nth-child(3)"
radio_3 = "#root > div > div:nth-child(2) fieldset div > label:nth-child(4)"
# H4 at 5714319: the readout's row, its value line's span and the form
# line's paragraph, all inside the Function card (card_function above covers
# the card itself). data-testid attributes select them (verified unique on
# the reference).
readout = "[data-testid=\"function-readout\"]"
value_line = "[data-testid=\"function-readout\"] > span"
form_line = "[data-testid=\"function-form\"]"
# H4 at 5714319: the Transform card (the sidebar's section child), its rows
# (the row divs; the readout's terms are spans, so div selects the rows),
# a's chip (the aria-hidden span), a's field (the row's input) and a's left
# chevron (the row's first svg).
card_transform = "#root > div > div:nth-child(2) > section"
row_a = "div[data-param=\"a\"]"
row_k = "div[data-param=\"k\"]"
row_b = "div[data-param=\"b\"]"
row_h = "div[data-param=\"h\"]"
chip_a = "div[data-param=\"a\"] > span[aria-hidden=\"true\"]"
field_a = "div[data-param=\"a\"] input"
# H5 at b8a0e1d: the chevrons are the box's own svgs (the row's first svg is
# now the flip toggle, h5-buttons's): the box's first svg is the left chevron.
arrows_a = 'div[data-param="a"] div:has(> input[type="text"]) > svg'
# H5 at b8a0e1d: a's value box (the div holding the input; the chevrons are
# svg, so :has picks the box) and the tip under it (the box's div child,
# present while resting or typing).
box_a = 'div[data-param="a"] div:has(> input[type="text"])'
tip_a = 'div[data-param="a"] div:has(> input[type="text"]) > div'
# H5 at b8a0e1d: the reset and flip buttons. reset_a shows only while a is
# off its default and Reset all only while any value is (both missing
# otherwise); the flips stand on the two scale rows. Rows are the divs with
# data-param (the readout's terms are spans), the flips are their only
# aria-pressed descendants, the head div is the card's first child.
reset_a = "div[data-param=\"a\"] [aria-label^=\"Reset\"]"
reset_all = "#root > div > div:nth-child(2) > section > div:first-child > button"
flip_a = "div[data-param=\"a\"] [aria-pressed]"
flip_b = "div[data-param=\"b\"] [aria-pressed]"
# H5 at b8a0e1d: the ruler card and the tape under a's dragged row (the
# ruler-* states hold the drag at their shot). The ruler is the row's last
# div child (the value box, then the ruler); aria-hidden tells it from the
# box, and the tape is the ruler's first div child.
ruler_a = "div[data-param=\"a\"] > div[aria-hidden=\"true\"]"
tape_a = "div[data-param=\"a\"] > div[aria-hidden=\"true\"] > div"
# H7 at 251c080: the rulers under the h and k rows while a shift-handle drag
# holds them (rows-lit-hk-drag keeps the press held at its shot), same shape
# as h5's ruler_a.
ruler_h = "div[data-param=\"h\"] > div[aria-hidden=\"true\"]"
ruler_k = "div[data-param=\"k\"] > div[aria-hidden=\"true\"]"

# H8 at 96f1e84: the x-of-P slider's track, thumb and tip. The two spans
# are the thumb (first) and the tip (last); the tip only boxes while shown.
slider_p = '[aria-label="x of P"]'
thumb_p = '[aria-label="x of P"] > span:first-of-type'
slider_tip_p = '[aria-label="x of P"] > span:last-of-type'
# H8 at 96f1e84: the Points card (the sidebar's second section), P's head
# row (the slider's parent's first div), Q's head (the next point block's
# first div), P's mark (the head's first svg), P's role slot (the head span
# holding spans that is not the readout: the off-mark triangle's span holds
# only an svg, the readout is the last span) and the two readouts (each
# head's last span). Verified boxes against ref-h8 (see progress).
card_points = "#root > div > div:nth-child(2) > section:nth-of-type(2)"
row_p = "div:has(> [role=slider]) > div:first-child"
row_q = "div:has(> [role=slider]) + div > div:first-child"
mark_p = "div:has(> [role=slider]) > div:first-child > svg:first-of-type"
role_p = "div:has(> [role=slider]) > div:first-child > span:has(> span):not(:last-child)"
readout_p = "div:has(> [role=slider]) > div:first-child > span:last-child"
readout_q = "div:has(> [role=slider]) + div > div:first-child > span:last-child"
# H8 at 96f1e84: P's x field (the readout x slot's input) and the P edit
# tip under the head (the point block's div holding the x-of-P slider; the
# tip renders only while the field edits, so the open/typing states carry
# it and the rest states miss it).
field_p = "input[aria-label=\"x of P, value\"]"
tip_p = "div:has(> [role=slider]) > div[aria-hidden=\"true\"]"

# h10-page: the welcome page's boxes, read on a welcome state (welcome-default;
# CSS module classes are hashed in Vite's dev build, so class names select by
# attribute and structure). mark is the root's first svg (the Logo, before the
# gear's); gear is the only button while the menu is closed; the hint is the
# actions div's paragraph after the description's.
mark = '[data-testid="root-view"] svg'
description = '[data-testid="root-view"] main h1 + p'
cta = '[data-testid="root-view"] a[href="#function-viewer"]'
hint = '[data-testid="root-view"] main p + div p'
welcome_chip_a = '[data-testid="root-view"] span[data-param="a"]'
welcome_chip_k = '[data-testid="root-view"] span[data-param="k"]'
welcome_chip_b = '[data-testid="root-view"] span[data-param="b"]'
welcome_chip_h = '[data-testid="root-view"] span[data-param="h"]'
hero_plane = '[data-testid="root-view"] canvas'

# h11-default: the reference's two dev-pages elements, left out of the port by
# the user's ruling (category (f)). welcome_dev_link on the welcome route's foot;
# menu_dev_link in the open settings menu (both routes).
welcome_dev_link = '[data-testid="root-view"] main + a[href="#dev"]'
menu_dev_link = 'div[id^="settings-menu-"] a[href="#dev"]'
