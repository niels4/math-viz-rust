[package]
name = "function-viewer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Plan 1.5: the release build compiles SDL3 3.4.18 from source (cmake + the
# vendored sdl3-src) and carries the dylib beside the binary, so it runs
# without Homebrew's SDL3. Dev and check builds link Homebrew's SDL3 through
# sdl3-sys's default `/opt/homebrew/lib` search: 3 s clean, no setup.
bundled-sdl = ["sdl3/build-from-source"]

[dependencies]
enum-map.workspace = true
enumset.workspace = true
glow.workspace = true
libc.workspace = true
mv-clay.path = "../mv-clay"
mv-motion.path = "../mv-motion"
mv-numfmt.path = "../mv-numfmt"
mv-nvg.path = "../mv-nvg"
mv-plane.path = "../mv-plane"
mv-script.path = "../mv-script"
mv-scrub.path = "../mv-scrub"
mv-sys.path = "../mv-sys"
mv-text.path = "../mv-text"
mv-theme.path = "../mv-theme"
mv-viewer.path = "../mv-viewer"
png.workspace = true
sdl3-main.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `main` feature is SDL3's main callbacks (SDL_AppInit/Iterate/Event/Quit
# through the `sdl3-main` crate's `#[app_impl]`): the loop SDL owns on both
# targets (plan 1.4, call 3). The fallback, if callbacks ever fail a target,
# is a hand-written loop behind the same app_init/iterate/event/quit
# functions; t0a measured callbacks working on both (progress/t0a.md).
[dependencies.sdl3]
workspace = true
features = ["main"]

# The web build always compiles SDL3 from source with emcc and links it
# statically: Emscripten's `-sUSE_SDL=3` port is not used (spike-wasm.md).
[target.'cfg(target_os = "emscripten")'.dependencies.sdl3]
workspace = true
features = ["main", "build-from-source"]

[build-dependencies]
cc.workspace = true
